name: Dependabot Auto-merge
on:
  pull_request:
    branches:
      - 'main'

permissions:
  pull-requests: write
  contents: write
  id-token: write

jobs:
  claude-review-check:
    runs-on: ubuntu-latest

    steps:
      - name: Claude Code Input Validation
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error::ANTHROPIC_API_KEY is missing"
            exit 1
          fi
          if [[ ${#ANTHROPIC_API_KEY} -le 5 ]]; then
            echo "::error::ANTHROPIC_API_KEY has incorrect length"
            exit 1
          fi
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "::error::NPM_TOKEN is missing"
            exit 1
          fi
          echo "Using ANTHROPIC_API_KEY ${ANTHROPIC_API_KEY:0:12}..."
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  dependabot-auto-merge:
    permissions:
      id-token: write
      pull-requests: write
      contents: write
      actions: read
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: HillwoodPark/shared-github-workflows/.github/workflows/dependabot-auto-approve.yml@a4002793d4b1e5c805137b9e5d323987781f0eb8
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      node-version: '24.x'
      npm-registry-url: 'https://npm.pkg.github.com'
