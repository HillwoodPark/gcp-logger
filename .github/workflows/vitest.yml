# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run build --if-present
    - run: npm test

  # Stable required-check context. The matrix job above reports as
  # `build (22.x)` / `build (24.x)` / `build (26.x)`, so a ruleset pinned to one
  # of those is coupled to the matrix contents AND gates only that single leg.
  # This job has no matrix, so its context name never changes, and it fails if
  # ANY leg failed.
  #
  # `if: always()` is load-bearing: without it a failed leg would skip this job,
  # and GitHub reports a skipped required check as SUCCESSFUL.
  #
  # `skipped` is still accepted defensively: if a job-level `if:` is ever added
  # back to the matrix job, this gate must not start failing every PR.
  build-gate:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Require every matrix leg
      env:
        RESULT: ${{ needs.build.result }}
      run: |
        echo "matrix result: $RESULT"
        case "$RESULT" in
          success|skipped) ;;
          *) exit 1 ;;
        esac
