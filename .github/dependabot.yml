# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Keep action pins current. Pinning without updating just freezes the repo on
  # whatever was current at pin time. First-party HillwoodPark refs (the shared
  # reusable workflows) are exempt from the cooldown so pin bumps propagate
  # immediately instead of by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      exclude:
        - "HillwoodPark/*"
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    registries: "*"
    schedule:
      interval: "daily"
    # Supply-chain cooldown: hold new releases 3 days (first-party @hillwoodpark exempt)
    cooldown:
      default-days: 3
      exclude:
        - "@hillwoodpark/*"
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.NPM_TOKEN}}
